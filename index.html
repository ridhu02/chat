<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Chat + WebRTC Call</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 padding:12px;
 font-family:Arial,sans-serif;
 background:#eef2f7;
}

.container{
 max-width:600px;
 margin:auto;
}


h2{
 text-align:center;
 color:#222;
}


.card{
 background:white;
 padding:15px;
 margin-bottom:15px;
 border-radius:15px;
 box-shadow:0 3px 12px rgba(0,0,0,.15);
}


input{
 width:100%;
 padding:13px;
 border-radius:10px;
 border:1px solid #ccc;
 font-size:16px;
 margin-bottom:10px;
}


button{

 width:100%;
 padding:13px;

 border:none;
 border-radius:10px;

 background:#1976d2;
 color:white;

 font-size:16px;

 margin:5px 0;

}


button:active{
 transform:scale(.96);
}


.danger{
 background:#e53935;
}


.row{

 display:flex;
 gap:10px;

}


.row button{
 flex:1;
}



.videoBox{

 display:grid;

 grid-template-columns:1fr 1fr;

 gap:10px;

}



video{

 width:100%;
 height:200px;

 background:#000;

 border-radius:12px;

 object-fit:cover;

}



#chatBox{

 height:260px;

 overflow-y:auto;

 background:#f7f7f7;

 padding:10px;

 border-radius:10px;

}



.msg{

background:#dcf8c6;

padding:10px;

border-radius:10px;

margin-bottom:8px;

display:flex;

justify-content:space-between;

gap:10px;

word-break:break-word;

}



.delete{

width:auto;

padding:5px 10px;

background:#555;

font-size:12px;

}



@media(max-width:500px){

.row{
 flex-direction:column;
}


.videoBox{

grid-template-columns:1fr;

}


video{

height:230px;

}

}


</style>

</head>


<body>


<div class="container">


<h2>
Chat + Video Call
</h2>



<div class="card">


<input id="roomInput"
placeholder="Enter Room ID">


<button onclick="joinRoom()">
Join Room
</button>


</div>



<div class="card">


<div class="row">

<button onclick="startVoiceCall()">
Voice Call
</button>


<button onclick="startVideoCall()">
Video Call
</button>


</div>



<div class="row">

<button onclick="answerCall()">
Answer
</button>


<button class="danger"
onclick="hangUp()">
End Call
</button>


</div>



<div class="row">

<button onclick="toggleMic()">
Mic
</button>


<button onclick="toggleCam()">
Camera
</button>


</div>


</div>




<div class="card">


<div class="videoBox">


<video id="localVideo"
autoplay
muted
playsinline>
</video>


<video id="remoteVideo"
autoplay
playsinline>
</video>


</div>


<audio id="remoteAudio"
autoplay>
</audio>


</div>





<div class="card">


<div id="chatBox"></div>


<br>


<input id="msgInput"
placeholder="Type message">


<button onclick="sendMsg()">
Send
</button>


</div>



</div>





<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<script>


const firebaseConfig = {


apiKey:
"AIzaSyC1Utqm2gFJMiYRJisnV1I0hcMy5xn9Ods",


authDomain:
"ridhu-app.firebaseapp.com",


projectId:
"ridhu-app",


messagingSenderId:
"104880398155",


appId:
"1:104880398155:web:d2bfa762e6fcf7a6f1d2ce"


};



firebase.initializeApp(firebaseConfig);


const db=firebase.firestore();



let roomRef=null;



// CHAT SYSTEM


function joinRoom(){


let id=document
.getElementById("roomInput")
.value.trim();



if(!id){

alert("Room ID enter karo");

return;

}



roomRef=db.collection("rooms").doc(id);


listenChat();


alert("Room Joined");


}





function listenChat(){


roomRef.collection("chat")

.orderBy("time","asc")

.onSnapshot(snapshot=>{


let box=document.getElementById("chatBox");


box.innerHTML="";


snapshot.forEach(doc=>{


let d=doc.data();


box.innerHTML+=`

<div class="msg">

<span>${d.text || ""}</span>

<button class="delete"
onclick="deleteMsg('${doc.id}')">
X
</button>

</div>

`;


});


box.scrollTop=box.scrollHeight;


});


}






async function sendMsg(){


if(!roomRef){

alert("Join room first");

return;

}


let input=document.getElementById("msgInput");


let text=input.value.trim();



if(!text)return;



await roomRef.collection("chat").add({

text:text,

time:Date.now()

});



input.value="";


}





async function deleteMsg(id){


if(roomRef){

await roomRef.collection("chat")
.doc(id)
.delete();

}


}



// WEBRTC PART 2 NEXT
// ================= WEBRTC SYSTEM =================


let pc=null;
let localStream=null;

let callerCandidates=null;
let calleeCandidates=null;


const servers={

iceServers:[

{
urls:"stun:stun.l.google.com:19302"
}

]

};




// GET CAMERA + MIC


async function getMedia(video){


try{


localStream=await navigator.mediaDevices.getUserMedia({

audio:true,

video:video

});


document.getElementById("localVideo")
.srcObject=localStream;



}catch(e){

alert("Camera/Mic permission allow karo");

console.log(e);

}


}






function createConnection(){



if(pc){

pc.close();

}



pc=new RTCPeerConnection(servers);



localStream.getTracks()
.forEach(track=>{

pc.addTrack(track,localStream);

});




pc.ontrack=function(event){


let remote=document.getElementById("remoteVideo");



if(!remote.srcObject){

remote.srcObject=new MediaStream();

}



event.streams[0]
.getTracks()
.forEach(track=>{


remote.srcObject.addTrack(track);


});



document.getElementById("remoteAudio")
.srcObject=remote.srcObject;


};



}







// VOICE CALL


async function startVoiceCall(){


if(!roomRef){

alert("Room join karo");

return;

}



await getMedia(false);



if(!localStream)return;



callerCandidates=
roomRef.collection("callerCandidates");


calleeCandidates=
roomRef.collection("calleeCandidates");



createConnection();



pc.onicecandidate=e=>{


if(e.candidate){

callerCandidates.add(
e.candidate.toJSON()
);

}


};




let offer=await pc.createOffer();


await pc.setLocalDescription(offer);




await roomRef.collection("offer")
.doc("call")
.set({

type:offer.type,

sdp:offer.sdp,

callType:"voice"

});





roomRef.collection("answer")
.doc("call")
.onSnapshot(async doc=>{


if(doc.exists && !pc.currentRemoteDescription){


await pc.setRemoteDescription(

new RTCSessionDescription(
doc.data()
)

);


}


});





calleeCandidates.onSnapshot(snapshot=>{


snapshot.docChanges()
.forEach(change=>{


if(change.type==="added"){


pc.addIceCandidate(

new RTCIceCandidate(
change.doc.data()
)

);


}



});


});



}







// VIDEO CALL


async function startVideoCall(){


if(!roomRef){

alert("Room join karo");

return;

}



await getMedia(true);



if(!localStream)return;



callerCandidates=
roomRef.collection("callerCandidates");


calleeCandidates=
roomRef.collection("calleeCandidates");



createConnection();




pc.onicecandidate=e=>{


if(e.candidate){

callerCandidates.add(
e.candidate.toJSON()
);

}


};




let offer=await pc.createOffer();



await pc.setLocalDescription(offer);




await roomRef.collection("offer")
.doc("call")
.set({

type:offer.type,

sdp:offer.sdp,

callType:"video"

});






roomRef.collection("answer")
.doc("call")
.onSnapshot(async doc=>{


if(doc.exists && !pc.currentRemoteDescription){


await pc.setRemoteDescription(

new RTCSessionDescription(
doc.data()
)

);


}



});






calleeCandidates.onSnapshot(snapshot=>{


snapshot.docChanges()
.forEach(change=>{


if(change.type==="added"){


pc.addIceCandidate(

new RTCIceCandidate(
change.doc.data()
)

);


}



});


});



}







// ANSWER CALL


async function answerCall(){



if(!roomRef){

alert("Room join karo");

return;

}




let offerDoc=await roomRef.collection("offer")
.doc("call")
.get();



if(!offerDoc.exists){

alert("Call nahi mili");

return;

}



let data=offerDoc.data();




await getMedia(
data.callType==="video"
);



if(!localStream)return;



callerCandidates=
roomRef.collection("callerCandidates");


calleeCandidates=
roomRef.collection("calleeCandidates");



createConnection();




pc.onicecandidate=e=>{


if(e.candidate){

calleeCandidates.add(
e.candidate.toJSON()
);

}


};




await pc.setRemoteDescription(

new RTCSessionDescription(data)

);




let answer=await pc.createAnswer();



await pc.setLocalDescription(answer);




await roomRef.collection("answer")
.doc("call")
.set({

type:answer.type,

sdp:answer.sdp

});






callerCandidates.onSnapshot(snapshot=>{


snapshot.docChanges()
.forEach(change=>{


if(change.type==="added"){


pc.addIceCandidate(

new RTCIceCandidate(
change.doc.data()
)

);


}



});


});



}









// MIC BUTTON


function toggleMic(){


if(!localStream)return;



let track=
localStream.getAudioTracks()[0];



if(track){

track.enabled=!track.enabled;

}


}






// CAMERA BUTTON


function toggleCam(){



if(!localStream)return;



let track=
localStream.getVideoTracks()[0];



if(track){

track.enabled=!track.enabled;


}else{


alert("Camera available nahi hai");


}


}







// END CALL


async function hangUp(){



if(pc){

pc.close();

pc=null;

}




if(localStream){


localStream.getTracks()
.forEach(track=>{


track.stop();


});


localStream=null;


}



document.getElementById("localVideo")
.srcObject=null;


document.getElementById("remoteVideo")
.srcObject=null;


document.getElementById("remoteAudio")
.srcObject=null;





if(roomRef){


await roomRef.collection("offer")
.doc("call")
.delete()
.catch(()=>{});



await roomRef.collection("answer")
.doc("call")
.delete()
.catch(()=>{});


}



}
</body>
</html>
