<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Multi-User Chat + Local Clear Chat + WebRTC Call + Flip Camera</title>
<style>
*{ box-sizing:border-box; }
body{ margin:0; padding:12px; font-family:Arial,sans-serif; background:#eef2f7; }
.container{ max-width:800px; margin:auto; }
h2{ text-align:center; color:#222; }
.card{ background:white; padding:15px; margin-bottom:15px; border-radius:15px; box-shadow:0 3px 12px rgba(0,0,0,.15); }
input[type="text"]{ width:100%; padding:13px; border-radius:10px; border:1px solid #ccc; font-size:16px; margin-bottom:10px; }
input[type="file"]{ display:none; }
button{ width:100%; padding:13px; border:none; border-radius:10px; background:#1976d2; color:white; font-size:16px; margin:5px 0; cursor:pointer; }
button:active{ transform:scale(.96); }
.danger{ background:#e53935; }
.warning{ background:#f57c00; }
.row{ display:flex; gap:10px; }
.row button{ flex:1; }
.videoBox{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; }
.video-card{ position:relative; background:#000; border-radius:12px; overflow:hidden; height:200px; }
video{ width:100%; height:100%; object-fit:cover; }
.video-overlay{ position:absolute; bottom:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:center; }
.video-label{ background:rgba(0,0,0,0.6); color:white; padding:2px 6px; font-size:11px; border-radius:4px; }
.host-controls{ display:flex; gap:4px; }
.host-btn{ background:#d32f2f; color:white; border:none; padding:3px 6px; font-size:10px; border-radius:4px; cursor:pointer; }
.chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.clear-chat-btn { width: auto; padding: 6px 12px; background: #e53935; font-size: 12px; margin: 0; border-radius: 6px; }
#chatBox{ height:280px; overflow-y:auto; background:#f7f7f7; padding:10px; border-radius:10px; margin-bottom:10px; }
.msg{ background:#dcf8c6; padding:10px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; word-break:break-word; }
.msg-content { display: flex; flex-direction: column; width: 100%; }
.msg-name { font-size: 11px; font-weight: bold; color: #1976d2; margin-bottom: 3px; }
.msg img, .msg video, .msg audio{ max-width:100%; border-radius:8px; margin-top:5px; max-height:160px; display:block; }
.btn-group { display: flex; gap: 5px; align-items: center; }
.action-btn{ width:auto; padding:5px 8px; background:#555; font-size:11px; border-radius:6px; cursor:pointer; border:none; color:white; margin:0; }
.edit-btn{ background:#f57c00; }
.delete-btn{ background:#e53935; }
.file-row{ display:flex; gap:5px; margin-bottom:10px; }
.file-row label, .file-row button{ flex:1; background:#455a64; color:white; text-align:center; padding:10px; border-radius:10px; cursor:pointer; font-size:14px; margin:0; border:none; }
.rec-start{ background:#d32f2f !important; }
.rec-stop{ background:#388e3c !important; }
@media(max-width:500px){ .row{ flex-direction:column; } .file-row{ flex-direction:column; } }
</style>
</head>
<body>

<div class="container">
<h2>Chat + Host Control + Clear Chat + Flip Camera</h2>

<div class="card">
<input type="text" id="nameInput" placeholder="Enter Your Name">
<input type="text" id="roomInput" placeholder="Enter Room ID">
<button onclick="joinRoom()">Join Room</button>
</div>

<div class="card">
<div class="row">
<button onclick="startCall()">Start Call</button>
<button class="warning" onclick="reconnectCall()">Reconnect</button>
<button class="danger" onclick="hangUp()">End Call</button>
</div>
<div class="row">
<button onclick="toggleMic()">Mic</button>
<button onclick="toggleCam()">Camera</button>
<button class="warning" onclick="switchCamera()">🔄 Flip Cam</button>
</div>
</div>

<div class="card">
<div class="videoBox" id="videoGrid">
<!-- Local Video -->
<div class="video-card" id="localWrapper">
<video id="localVideo" autoplay muted playsinline></video>
<div class="video-overlay">
<span class="video-label" id="localNameLabel">You</span>
</div>
</div>
</div>
</div>

<div class="card">
<div class="chat-header">
  <b>Group Chat</b>
  <button class="clear-chat-btn" onclick="clearChat()">Clear Chat</button>
</div>
<div id="chatBox"></div>
<input type="text" id="msgInput" placeholder="Type message">
<button onclick="sendMsg()">Send Text</button>
<div class="file-row">
<label for="imageInput">📷 Image</label>
<label for="videoInput">🎥 Video</label>
<label for="audioInput">🎵 Audio File</label>
</div>

<div class="file-row">
<button class="rec-start" onclick="startVoiceRecording()">🎙️ Record Voice</button>
<button class="rec-stop" onclick="stopVoiceRecording()">⏹️ Send Audio</button>
</div>

<input type="file" id="imageInput" accept="image/*" onchange="sendFile(this, 'image')">
<input type="file" id="videoInput" accept="video/*" onchange="sendFile(this, 'video')">
<input type="file" id="audioInput" accept="audio/*" onchange="sendFile(this, 'audio')">
</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC1Utqm2gFJMiYRJisnV1I0hcMy5xn9Ods",
  authDomain: "ridhu-app.firebaseapp.com",
  projectId: "ridhu-app",
  messagingSenderId: "104880398155",
  appId: "1:104880398155:web:d2bfa762e6fcf7a6f1d2ce"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let roomRef = null;
let userId = 'user_' + Math.random().toString(36).substr(2, 9);
let userName = "Anonymous";
let isHost = false;
let localStream = null;
let peers = {}; 

let useFrontCamera = true; // Tracks current camera state

let mediaRecorder = null;
let audioChunks = [];
let localClearedTime = 0;

const servers = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ]
};

async function joinRoom(){
  let nameInp = document.getElementById("nameInput").value.trim();
  let id = document.getElementById("roomInput").value.trim();
  
  if(!nameInp){
    alert("Please enter your name!");
    return;
  }
  if(!id){
    alert("Please enter a Room ID!");
    return;
  }

  userName = nameInp;
  roomRef = db.collection("rooms").doc(id);

  try {
    await db.runTransaction(async (transaction) => {
      let doc = await transaction.get(roomRef);
      if (!doc.exists || !doc.data().hostId) {
        transaction.set(roomRef, { hostId: userId, hostName: userName, createdAt: Date.now() }, { merge: true });
        isHost = true;
      } else {
        isHost = (doc.data().hostId === userId);
      }
    });
  } catch (e) {
    console.error("Host assignment error:", e);
    isHost = false;
  }

  let labelText = userName + " (You)" + (isHost ? " 👑 [Host]" : "");
  document.getElementById("localNameLabel").innerText = labelText;

  listenChat();
  listenHostCommands();
  alert("Room joined successfully as " + (isHost ? "Host 👑" : userName) + "!");
}

function listenChat(){
  roomRef.collection("chat").orderBy("time","asc").onSnapshot(snapshot=>{
    let box = document.getElementById("chatBox");
    box.innerHTML = "";
    snapshot.forEach(doc=>{
      let d = doc.data();
      if (d.time <= localClearedTime) return;

      let content = "";
      if(d.type === "text" || !d.type){
        content = `<span>${d.text || ""}</span>`;
      } else if(d.type === "image"){
        content = `<img src="${d.fileData}" alt="image">`;
      } else if(d.type === "video"){
        content = `<video src="${d.fileData}" controls></video>`;
      } else if(d.type === "audio" || d.type === "voice"){
        content = `<audio src="${d.fileData}" controls></audio>`;
      }

      let isMyMsg = d.sender === userId;
      let actionButtons = `
        <div class="btn-group">
          ${(d.type === "text" || !d.type) && isMyMsg ? `<button class="action-btn edit-btn" onclick="editMsg('${doc.id}', \`${encodeURIComponent(d.text || '')}\`)">Edit</button>` : ''}
          ${isMyMsg || isHost ? `<button class="action-btn delete-btn" onclick="deleteMsg('${doc.id}')">X</button>` : ''}
        </div>
      `;

      box.innerHTML += `
        <div class="msg">
          <div class="msg-content">
            <span class="msg-name">${d.senderName || "Unknown"}</span>
            ${content}
          </div>
          ${actionButtons}
        </div>
      `;
    });
    box.scrollTop = box.scrollHeight;
  });
}

async function sendMsg(){
  if(!roomRef){ alert("Please join a room first!"); return; }
  let input = document.getElementById("msgInput");
  let text = input.value.trim();
  if(!text) return;
  
  await roomRef.collection("chat").add({
    type: "text",
    text: text,
    time: Date.now(),
    sender: userId,
    senderName: userName
  });
  input.value = "";
}

async function editMsg(id, encodedText){
  let oldText = decodeURIComponent(encodedText);
  let newText = prompt("Edit your message:", oldText);
  if(newText !== null && newText.trim() !== ""){
    await roomRef.collection("chat").doc(id).update({ text: newText.trim() });
  }
}

function sendFile(inputElement, type){
  if(!roomRef){ alert("Please join a room first!"); inputElement.value = ""; return; }
  let file = inputElement.files[0];
  if(!file) return;

  if(file.size > 800 * 1024){
    alert("File size is too large! Please select a file smaller than 800KB.");
    inputElement.value = "";
    return;
  }

  let reader = new FileReader();
  reader.onload = async function(e){
    await roomRef.collection("chat").add({
      type: type,
      fileData: e.target.result,
      time: Date.now(),
      sender: userId,
      senderName: userName
    });
    inputElement.value = "";
  };
  reader.readAsDataURL(file);
}

async function startVoiceRecording(){
  if(!roomRef){ alert("Please join a room first!"); return; }
  try {
    let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    
    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
    mediaRecorder.onstop = async () => {
      let audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      let reader = new FileReader();
      reader.onload = async function(e){
        await roomRef.collection("chat").add({
          type: "voice",
          fileData: e.target.result,
          time: Date.now(),
          sender: userId,
          senderName: userName
        });
      };
      reader.readAsDataURL(audioBlob);
      stream.getTracks().forEach(track => track.stop());
    };

    mediaRecorder.start();
    alert("🎙️ Voice recording started...");
  } catch(e) {
    alert("Microphone permission denied!");
  }
}

function stopVoiceRecording(){
  if(mediaRecorder && mediaRecorder.state !== "inactive"){
    mediaRecorder.stop();
    alert("⏹️ Voice message sent successfully!");
  }
}

async function deleteMsg(id){
  if(roomRef) await roomRef.collection("chat").doc(id).delete();
}

function clearChat(){
  if(!roomRef){ alert("Please join a room first!"); return; }
  
  if(confirm("Do you want to clear chat for yourself only, or for everyone? (OK = For Everyone [Host only], Cancel = For Yourself Only)")){
    if(!isHost){
      alert("Only the Host can clear chat for everyone!");
      return;
    }
    roomRef.collection("chat").get().then(snapshot => {
      let batch = db.batch();
      snapshot.docs.forEach((doc) => {
        batch.delete(doc.ref);
      });
      batch.commit().then(() => {
        alert("Chat cleared for everyone successfully!");
      });
    });
  } else {
    localClearedTime = Date.now();
    document.getElementById("chatBox").innerHTML = "";
    alert("Chat cleared for you successfully!");
  }
}

function listenHostCommands(){
  roomRef.collection("commands").doc(userId).onSnapshot(doc => {
    if(doc.exists){
      let cmd = doc.data();
      if(cmd.action === "mute"){
        if(localStream){
          let track = localStream.getAudioTracks()[0];
          if(track) track.enabled = false;
          alert("The host has muted your microphone!");
        }
      } else if(cmd.action === "kick"){
        alert("You have been kicked out of the room by the host!");
        hangUp();
      }
      doc.ref.delete().catch(()=>{});
    }
  });
}

async function getMedia(){
  try{
    if(localStream){
      localStream.getTracks().forEach(track => track.stop());
    }
    
    let constraints = {
      audio: true,
      video: { facingMode: useFrontCamera ? "user" : "environment" }
    };

    localStream = await navigator.mediaDevices.getUserMedia(constraints);
    let localVid = document.getElementById("localVideo");
    if(localVid) localVid.srcObject = localStream;

    // Update tracks for active peer connections if call is ongoing
    for(let id in peers){
      let sender = peers[id].getSenders().find(s => s.track && s.track.kind === 'video');
      if(sender){
        let videoTrack = localStream.getVideoTracks()[0];
        sender.replaceTrack(videoTrack);
      }
    }
  }catch(e){
    alert("Please allow Camera and Microphone permissions.");
  }
}

async function switchCamera(){
  useFrontCamera = !useFrontCamera;
  await getMedia();
}

async function startCall(){
  if(!roomRef){ alert("Please join a room first."); return; }
  await getMedia();
  if(!localStream) return;

  await roomRef.collection("users").doc(userId).set({ 
    name: userName, 
    isHost: isHost,
    online: true, 
    time: Date.now() 
  });

  roomRef.collection("users").onSnapshot(snapshot => {
    snapshot.docChanges().forEach(async change => {
      let targetUserId = change.doc.id;
      if(targetUserId === userId) return;

      if(change.type === "added"){
        let isInitiator = userId > targetUserId;
        let userData = change.doc.data();
        createPeerConnection(targetUserId, isInitiator, userData ? userData.name : "User", userData ? userData.isHost : false);
      }
      if(change.type === "removed"){
        if(peers[targetUserId]){
          peers[targetUserId].close();
          delete peers[targetUserId];
          let cardEl = document.getElementById("card_" + targetUserId);
          if(cardEl) cardEl.remove();
        }
      }
    });
  });

  listenSignals();
}

function reconnectCall(){
  if(!roomRef) { alert("Please join a room first."); return; }
  alert("Reconnecting call...");
  startCall();
}

function createPeerConnection(targetUserId, isInitiator, remoteUserName, remoteIsHost){
  if(peers[targetUserId]) return peers[targetUserId];

  let pc = new RTCPeerConnection(servers);
  peers[targetUserId] = pc;

  if(localStream){
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }

  pc.onicecandidate = event => {
    if(event.candidate){
      roomRef.collection("signals").add({
        from: userId,
        to: targetUserId,
        type: "candidate",
        candidate: event.candidate.toJSON(),
        time: Date.now()
      });
    }
  };

  pc.ontrack = event => {
    let cardId = "card_" + targetUserId;
    let videoCard = document.getElementById(cardId);

    if(!videoCard){
      let videoGrid = document.getElementById("videoGrid");
      videoCard = document.createElement("div");
      videoCard.className = "video-card";
      videoCard.id = cardId;
      
      let videoElement = document.createElement("video");
      videoElement.id = "video_" + targetUserId;
      videoElement.autoplay = true;
      videoElement.playsInline = true;
      
      let overlay = document.createElement("div");
      overlay.className = "video-overlay";

      let label = document.createElement("span");
      label.className = "video-label";
      label.innerText = remoteUserName + (remoteIsHost ? " 👑 [Host]" : "");
      overlay.appendChild(label);

      if(isHost){
        let controlsDiv = document.createElement("div");
        controlsDiv.className = "host-controls";

        let muteBtn = document.createElement("button");
        muteBtn.className = "host-btn";
        muteBtn.innerText = "Mute";
        muteBtn.onclick = () => hostAction(targetUserId, "mute");

        let kickBtn = document.createElement("button");
        kickBtn.className = "host-btn";
        kickBtn.style.background = "#b71c1c";
        kickBtn.innerText = "Kick";
        kickBtn.onclick = () => hostAction(targetUserId, "kick");

        controlsDiv.appendChild(muteBtn);
        controlsDiv.appendChild(kickBtn);
        overlay.appendChild(controlsDiv);
      }

      videoCard.appendChild(videoElement);
      videoCard.appendChild(overlay);
      videoGrid.appendChild(videoCard);
    }

    let videoElement = document.getElementById("video_" + targetUserId);
    if(!videoElement.srcObject){
      videoElement.srcObject = new MediaStream();
    }
    
    let trackExists = false;
    videoElement.srcObject.getTracks().forEach(t => {
      if(t.id === event.track.id) trackExists = true;
    });
    if(!trackExists){
      videoElement.srcObject.addTrack(event.track);
    }
  };

  if(isInitiator){
    pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
      roomRef.collection("signals").add({
        from: userId,
        to: targetUserId,
        type: "offer",
        offer: { type: pc.localDescription.type, sdp: pc.localDescription.sdp },
        time: Date.now()
      });
    }).catch(err => console.log(err));
  }

  return pc;
}

function hostAction(targetId, actionType){
  if(!isHost) return;
  roomRef.collection("commands").doc(targetId).set({
    action: actionType,
    time: Date.now()
  });
  alert("Command sent successfully!");
}

function listenSignals(){
  roomRef.collection("signals").where("to", "==", userId).onSnapshot(snapshot => {
    snapshot.docChanges().forEach(async change => {
      if(change.type === "added"){
        let data = change.doc.data();
        let fromId = data.from;
        let pc = peers[fromId];

        if(!pc){
          let userDoc = await roomRef.collection("users").doc(fromId).get();
          let rName = userDoc.exists ? userDoc.data().name : "User";
          let rHost = userDoc.exists ? userDoc.data().isHost : false;
          pc = createPeerConnection(fromId, false, rName, rHost);
        }

        try {
          if(data.type === "offer"){
            if(pc.signalingState === "stable" || pc.signalingState === "have-local-offer"){
              await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
              let answer = await pc.createAnswer();
              await pc.setLocalDescription(answer);
              roomRef.collection("signals").add({
                from: userId,
                to: fromId,
                type: "answer",
                answer: { type: pc.localDescription.type, sdp: pc.localDescription.sdp },
                time: Date.now()
              });
            }
          } else if(data.type === "answer"){
            if(pc.signalingState === "have-local-offer"){
              await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
          } else if(data.type === "candidate"){
            if(data.candidate && pc.remoteDescription){
              await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
          }
        } catch(e) { console.error(e); }
        
        change.doc.ref.delete().catch(()=>{});
      }
    });
  });
}

function toggleMic(){
  if(!localStream) return;
  let track = localStream.getAudioTracks()[0];
  if(track) track.enabled = !track.enabled;
}

function toggleCam(){
  if(!localStream) return;
  let track = localStream.getVideoTracks()[0];
  if(track) track.enabled = !track.enabled;
}

async function hangUp(){
  if(roomRef && userId){
    await roomRef.collection("users").doc(userId).delete().catch(()=>{});
  }
  for(let key in peers){
    peers[key].close();
  }
  peers = {};

  if(localStream){
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }

  let videoGrid = document.getElementById("videoGrid");
  videoGrid.innerHTML = `
    <div class="video-card" id="localWrapper">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="video-overlay">
        <span class="video-label" id="localNameLabel">You</span>
      </div>
    </div>
  `;
}
</script>
</body>
