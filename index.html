<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Multi-User Chat + Voice Note + WebRTC Call</title>
<style>
*{ box-sizing:border-box; }
body{ margin:0; padding:12px; font-family:Arial,sans-serif; background:#eef2f7; }
.container{ max-width:800px; margin:auto; }
h2{ text-align:center; color:#222; }
.card{ background:white; padding:15px; margin-bottom:15px; border-radius:15px; box-shadow:0 3px 12px rgba(0,0,0,.15); }
input[type="text"]{ width:100%; padding:13px; border-radius:10px; border:1px solid #ccc; font-size:16px; margin-bottom:10px; }
input[type="file"]{ display:none; }
button{ width:100%; padding:13px; border:none; border-radius:10px; background:#1976d2; color:white; font-size:16px; margin:5px 0; cursor:pointer; }
button:active{ transform:scale(.96); }
.danger{ background:#e53935; }
.warning{ background:#f57c00; }
.success{ background:#2e7d32; }
.row{ display:flex; gap:10px; }
.row button{ flex:1; }
.videoBox{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; }
video{ width:100%; height:200px; background:#000; border-radius:12px; object-fit:cover; }
#chatBox{ height:280px; overflow-y:auto; background:#f7f7f7; padding:10px; border-radius:10px; margin-bottom:10px; }
.msg{ background:#dcf8c6; padding:10px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; word-break:break-word; }
.msg img, .msg video, .msg audio{ max-width:100%; border-radius:8px; margin-top:5px; max-height:180px; display:block; }
.delete{ width:auto; padding:5px 10px; background:#555; font-size:12px; border-radius:6px; cursor:pointer; }
.file-row{ display:flex; gap:5px; margin-bottom:10px; }
.file-row label, .file-row button{ flex:1; background:#455a64; color:white; text-align:center; padding:10px; border-radius:10px; cursor:pointer; font-size:14px; margin:0; border:none; }
.rec-start{ background:#d32f2f !important; }
.rec-stop{ background:#388e3c !important; }
@media(max-width:500px){ .row{ flex-direction:column; } video{ height:230px; } .file-row{ flex-direction:column; } }
</style>
</head>
<body>

<div class="container">
<h2>Multi-User Chat + Voice Note + Video Call</h2>

<div class="card">
<input type="text" id="roomInput" placeholder="Enter Room ID">
<button onclick="joinRoom()">Join Room</button>
</div>

<div class="card">
<div class="row">
<button onclick="startCall()">Start Call</button>
<button class="warning" onclick="reconnectCall()">Reconnect</button>
<button class="danger" onclick="hangUp()">End Call</button>
</div>
<div class="row">
<button onclick="toggleMic()">Mic</button>
<button onclick="toggleCam()">Camera</button>
</div>
</div>

<div class="card">
<div class="videoBox" id="videoGrid">
<!-- Local Video -->
<div style="position:relative;" id="localWrapper">
<video id="localVideo" autoplay muted playsinline></video>
<span style="position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.5); color:white; padding:2px 6px; font-size:12px; border-radius:4px;">You</span>
</div>
</div>
</div>

<div class="card">
<div id="chatBox"></div>

<div class="file-row">
<label for="imageInput">📷 Image</label>
<label for="videoInput">🎥 Video</label>
<label for="audioInput">🎵 Audio File</label>
</div>

<div class="file-row">
<button class="rec-start" onclick="startVoiceRecording()">🎙️ Record Voice</button>
<button class="rec-stop" onclick="stopVoiceRecording()">⏹️ Stop & Send</button>
</div>

<input type="file" id="imageInput" accept="image/*" onchange="sendFile(this, 'image')">
<input type="file" id="videoInput" accept="video/*" onchange="sendFile(this, 'video')">
<input type="file" id="audioInput" accept="audio/*" onchange="sendFile(this, 'audio')">

<input type="text" id="msgInput" placeholder="Type message">
<button onclick="sendMsg()">Send Text</button>
</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC1Utqm2gFJMiYRJisnV1I0hcMy5xn9Ods",
  authDomain: "ridhu-app.firebaseapp.com",
  projectId: "ridhu-app",
  messagingSenderId: "104880398155",
  appId: "1:104880398155:web:d2bfa762e6fcf7a6f1d2ce"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let roomRef = null;
let userId = 'user_' + Math.random().toString(36).substr(2, 9);
let localStream = null;
let peers = {}; 

// Voice Recording Variables
let mediaRecorder = null;
let audioChunks = [];

const servers = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ]
};

// CHAT SYSTEM
function joinRoom(){
  let id = document.getElementById("roomInput").value.trim();
  if(!id){
    alert("Room ID enter karo");
    return;
  }
  roomRef = db.collection("rooms").doc(id);
  listenChat();
  alert("Room Joined Successfully!");
}

function listenChat(){
  roomRef.collection("chat").orderBy("time","asc").onSnapshot(snapshot=>{
    let box = document.getElementById("chatBox");
    box.innerHTML = "";
    snapshot.forEach(doc=>{
      let d = doc.data();
      let content = "";

      if(d.type === "text"){
        content = `<span>${d.text}</span>`;
      } else if(d.type === "image"){
        content = `<img src="${d.fileData}" alt="image">`;
      } else if(d.type === "video"){
        content = `<video src="${d.fileData}" controls></video>`;
      } else if(d.type === "audio" || d.type === "voice"){
        content = `<audio src="${d.fileData}" controls></audio>`;
      }

      box.innerHTML += `
        <div class="msg">
          <div>
            <small style="color:#666; font-size:10px; display:block;">${d.sender === userId ? 'You' : d.sender.substr(0, 8)}</small>
            ${content}
          </div>
          <button class="delete" onclick="deleteMsg('${doc.id}')">X</button>
        </div>
      `;
    });
    box.scrollTop = box.scrollHeight;
  });
}

async function sendMsg(){
  if(!roomRef){
    alert("Join room first");
    return;
  }
  let input = document.getElementById("msgInput");
  let text = input.value.trim();
  if(!text) return;
  
  await roomRef.collection("chat").add({
    type: "text",
    text: text,
    time: Date.now(),
    sender: userId
  });
  input.value = "";
}

function sendFile(inputElement, type){
  if(!roomRef){
    alert("Pehle Room join karo!");
    inputElement.value = "";
    return;
  }
  let file = inputElement.files[0];
  if(!file) return;

  if(file.size > 800 * 1024){
    alert("File size bahut badi hai! Kripya 800KB se choti file select karein.");
    inputElement.value = "";
    return;
  }

  let reader = new FileReader();
  reader.onload = async function(e){
    let base64Data = e.target.result;
    await roomRef.collection("chat").add({
      type: type,
      fileData: base64Data,
      time: Date.now(),
      sender: userId
    });
    inputElement.value = "";
  };
  reader.readAsDataURL(file);
}

// VOICE RECORDING FUNCTIONS
async function startVoiceRecording(){
  if(!roomRef){
    alert("Pehle Room join karo!");
    return;
  }
  try {
    let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    
    mediaRecorder.ondataavailable = event => {
      audioChunks.push(event.data);
    };

    mediaRecorder.onstop = async () => {
      let audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      
      let reader = new FileReader();
      reader.onload = async function(e){
        let base64Data = e.target.result;
        await roomRef.collection("chat").add({
          type: "voice",
          fileData: base64Data,
          time: Date.now(),
          sender: userId
        });
      };
      reader.readAsDataURL(audioBlob);

      // Stop mic tracks
      stream.getTracks().forEach(track => track.stop());
    };

    mediaRecorder.start();
    alert("🎙️ Recording shuru ho gayi hai... Bolna shuru karein.");
  } catch(e) {
    alert("Microphone permission nahi mili!");
    console.error(e);
  }
}

function stopVoiceRecording(){
  if(mediaRecorder && mediaRecorder.state !== "inactive"){
    mediaRecorder.stop();
    alert("⏹️ Voice message record hokar send ho gaya hai!");
  } else {
    alert("Recording pehle se active nahi hai.");
  }
}

async function deleteMsg(id){
  if(roomRef){
    await roomRef.collection("chat").doc(id).delete();
  }
}

// MULTI-USER WEBRTC SYSTEM
async function getMedia(){
  if(localStream) return;
  try{
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    let localVid = document.getElementById("localVideo");
    if(localVid) localVid.srcObject = localStream;
  }catch(e){
    alert("Camera/Mic permission allow karo");
    console.log(e);
  }
}

async function startCall(){
  if(!roomRef){
    alert("Room join karo pehle");
    return;
  }
  await getMedia();
  if(!localStream) return;

  await roomRef.collection("users").doc(userId).set({ online: true, time: Date.now() });

  roomRef.collection("users").onSnapshot(snapshot => {
    snapshot.docChanges().forEach(async change => {
      let targetUserId = change.doc.id;
      if(targetUserId === userId) return;

      if(change.type === "added"){
        let isInitiator = userId > targetUserId;
        createPeerConnection(targetUserId, isInitiator);
      }
      if(change.type === "removed"){
        if(peers[targetUserId]){
          peers[targetUserId].close();
          delete peers[targetUserId];
          let videoEl = document.getElementById("video_" + targetUserId);
          if(videoEl) videoEl.parentElement.remove();
        }
      }
    });
  });

  listenSignals();
}

function reconnectCall(){
  if(!roomRef) {
    alert("Room join karo");
    return;
  }
  alert("Reconnecting call...");
  startCall();
}

function createPeerConnection(targetUserId, isInitiator){
  if(peers[targetUserId]){
    return peers[targetUserId];
  }

  let pc = new RTCPeerConnection(servers);
  peers[targetUserId] = pc;

  if(localStream){
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }

  pc.onicecandidate = event => {
    if(event.candidate){
      roomRef.collection("signals").add({
        from: userId,
        to: targetUserId,
        type: "candidate",
        candidate: event.candidate.toJSON(),
        time: Date.now()
      });
    }
  };

  pc.ontrack = event => {
    let videoId = "video_" + targetUserId;
    let videoElement = document.getElementById(videoId);

    if(!videoElement){
      let videoGrid = document.getElementById("videoGrid");
      let wrapper = document.createElement("div");
      wrapper.style.position = "relative";
      
      videoElement = document.createElement("video");
      videoElement.id = videoId;
      videoElement.autoplay = true;
      videoElement.playsInline = true;
      
      let label = document.createElement("span");
      label.innerText = "User " + targetUserId.substr(5, 4);
      label.style.cssText = "position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.5); color:white; padding:2px 6px; font-size:12px; border-radius:4px;";
      
      wrapper.appendChild(videoElement);
      wrapper.appendChild(label);
      videoGrid.appendChild(wrapper);
    }

    if(!videoElement.srcObject){
      videoElement.srcObject = new MediaStream();
    }
    
    let trackExists = false;
    videoElement.srcObject.getTracks().forEach(t => {
      if(t.id === event.track.id) trackExists = true;
    });
    if(!trackExists){
      videoElement.srcObject.addTrack(event.track);
    }
  };

  if(isInitiator){
    pc.createOffer().then(offer => {
      return pc.setLocalDescription(offer);
    }).then(() => {
      roomRef.collection("signals").add({
        from: userId,
        to: targetUserId,
        type: "offer",
        offer: { type: pc.localDescription.type, sdp: pc.localDescription.sdp },
        time: Date.now()
      });
    }).catch(err => console.log("Offer creation error:", err));
  }

  return pc;
}

function listenSignals(){
  roomRef.collection("signals").where("to", "==", userId).onSnapshot(snapshot => {
    snapshot.docChanges().forEach(async change => {
      if(change.type === "added"){
        let data = change.doc.data();
        let fromId = data.from;
        let pc = peers[fromId];

        if(!pc){
          pc = createPeerConnection(fromId, false);
        }

        try {
          if(data.type === "offer"){
            if(pc.signalingState === "stable" || pc.signalingState === "have-local-offer"){
              await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
              let answer = await pc.createAnswer();
              await pc.setLocalDescription(answer);
              roomRef.collection("signals").add({
                from: userId,
                to: fromId,
                type: "answer",
                answer: { type: pc.localDescription.type, sdp: pc.localDescription.sdp },
                time: Date.now()
              });
            }
          } else if(data.type === "answer"){
            if(pc.signalingState === "have-local-offer"){
              await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
          } else if(data.type === "candidate"){
            if(data.candidate && pc.remoteDescription){
              await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
          }
        } catch(e) {
          console.error("Signaling error with user", fromId, e);
        }
        
        change.doc.ref.delete().catch(()=>{});
      }
    });
  });
}

function toggleMic(){
  if(!localStream) return;
  let track = localStream.getAudioTracks()[0];
  if(track) track.enabled = !track.enabled;
}

function toggleCam(){
  if(!localStream) return;
  let track = localStream.getVideoTracks()[0];
  if(track) {
    track.enabled = !track.enabled;
  } else {
    alert("Camera available nahi hai");
  }
}

async function hangUp(){
  if(roomRef && userId){
    await roomRef.collection("users").doc(userId).delete().catch(()=>{});
  }
  for(let key in peers){
    peers[key].close();
  }
  peers = {};

  if(localStream){
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }

  let videoGrid = document.getElementById("videoGrid");
  videoGrid.innerHTML = `
    <div style="position:relative;" id="localWrapper">
      <video id="localVideo" autoplay muted playsinline></video>
      <span style="position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.5); color:white; padding:2px 6px; font-size:12px; border-radius:4px;">You</span>
    </div>
  `;
}
</script>
</body>
</html>
